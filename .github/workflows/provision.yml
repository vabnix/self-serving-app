# Triggered by the portal when a developer submits a request, and again when
# they delete it. Runs the Terraform template for the requested service with
# the inputs from the form, to create or destroy the resource.
# Reports the result back to the portal. Still to be added: policy scan and
# approval gate.
name: Provision resource
run-name: ${{ inputs.action == 'destroy' && 'Destroy' || 'Provision' }} ${{ inputs.template }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Portal request ID
        required: true
        type: string
      template:
        description: Catalog template to provision
        required: true
        type: string
      inputs:
        description: Terraform input variables as a JSON object
        required: true
        type: string
      action:
        description: apply creates or updates the resource, destroy removes it
        required: false
        type: choice
        options: [apply, destroy]
        default: apply
      callback_url:
        description: Portal URL to report the result to
        required: false
        type: string
      callback_token:
        description: One-time token for the callback, issued per request
        required: false
        type: string

permissions:
  contents: read
  # Lets the job sign in to Azure through OIDC federation.
  id-token: write

# The identity and state storage created by scripts/azure-github-identity.sh
# and scripts/azure-terraform-state.sh. These are identifiers, not secrets;
# access comes from the federated credential.
env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: b4c1a528-e374-43cf-94ac-1e897922d5c2
  ARM_TENANT_ID: ed7289ca-458d-4b7d-9747-640a95980153
  ARM_SUBSCRIPTION_ID: 66d91e75-93f4-487e-a3ee-25f4bad3a5b7
  STATE_RESOURCE_GROUP: rg-selfservice-poc
  STATE_ACCOUNT: stselfservicepoc66d91e
  STATE_CONTAINER: tfstate
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_request_id: ${{ inputs.request_id }}
  # Region for resource groups the workflow has to create.
  DEFAULT_LOCATION: centralus

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Mask callback token
        env:
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
        run: |
          if [[ -n "$CALLBACK_TOKEN" ]]; then echo "::add-mask::$CALLBACK_TOKEN"; fi

      - uses: actions/checkout@v4

      - name: Select template
        env:
          TEMPLATE: ${{ inputs.template }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$TEMPLATE" =~ ^[a-z0-9-]+$ || ! -d "terraform/$TEMPLATE" ]]; then
            echo "::error::No Terraform template for '$TEMPLATE'."
            exit 1
          fi
          if [[ ! "$REQUEST_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid request ID."
            exit 1
          fi
          echo "TF_DIR=terraform/$TEMPLATE" >> "$GITHUB_ENV"

      - name: Write Terraform variables
        env:
          INPUTS: ${{ inputs.inputs }}
        run: |
          printf '%s' "$INPUTS" | jq -e 'type == "object"' > /dev/null
          printf '%s' "$INPUTS" | jq . > "$TF_DIR/terraform.tfvars.json"
          {
            echo '### Terraform inputs'
            echo '```json'
            cat "$TF_DIR/terraform.tfvars.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      # The requester names the resource group. Use it if it exists, create it
      # otherwise. Groups are shared between requests, so they are created
      # here rather than by a request's Terraform state.
      - name: Ensure resource group
        if: inputs.action != 'destroy'
        run: |
          group="$(jq -r '.resource_group // empty' "$TF_DIR/terraform.tfvars.json")"
          if [[ -z "$group" ]]; then exit 0; fi
          if az group show --name "$group" --output none 2>/dev/null; then
            echo "Using existing resource group $group."
          else
            az group create --name "$group" --location "$DEFAULT_LOCATION" \
              --tags managed_by=self-service-portal --output none
            echo "Created resource group $group."
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          terraform -chdir="$TF_DIR" init \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$REQUEST_ID.tfstate"

      - name: Terraform plan
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$ACTION" == "destroy" ]]; then
            terraform -chdir="$TF_DIR" plan -destroy -out=tfplan
          else
            terraform -chdir="$TF_DIR" plan -out=tfplan
          fi

      - name: Terraform apply
        run: terraform -chdir="$TF_DIR" apply tfplan

      - name: Record outputs
        if: inputs.action != 'destroy'
        run: |
          {
            echo '### Terraform outputs'
            echo '```json'
            terraform -chdir="$TF_DIR" output -json | jq 'map_values(.value)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report result to portal
        if: always() && inputs.callback_url != ''
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          JOB_STATUS: ${{ job.status }}
          ACTION: ${{ inputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failed
          outputs='{}'
          if [[ "$JOB_STATUS" == "success" && "$ACTION" == "destroy" ]]; then
            status=deleted
          elif [[ "$JOB_STATUS" == "success" ]]; then
            status=deployed
            outputs="$(terraform -chdir="$TF_DIR" output -json | jq -c 'map_values(.value)')"
          fi
          jq -n --arg status "$status" --arg run_url "$RUN_URL" \
            --argjson outputs "$outputs" \
            '{status: $status, run_url: $run_url, outputs: $outputs}' > result.json
          # The portal runs on a free tier that sleeps when idle, so retry.
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data @result.json
